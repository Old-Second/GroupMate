name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.1, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --no-optional
      - run: pnpm run lint
      - run: pnpm test
      - run: node scripts/check-dist-drift.mjs
      - name: syntax check entry points
        run: |
          for file in index.js guoba.support.js apps/*.js scripts/*.mjs; do
            node --check "$file"
          done
      - run: git diff --check "$(git rev-list --max-parents=0 HEAD)"..HEAD
