name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.1, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # 不能加 --no-optional：ajv-formats 把 ajv 声明为可选 peer，跳过后
      # .pnpm/ajv-formats@2.1.1_ajv@8.12.0 里不会链入 ajv，Fastify 的
      # error serializer 一加载就 Cannot find module 'ajv/dist/compile/codegen'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint
      - run: pnpm test
      - run: node scripts/check-dist-drift.mjs
      - name: syntax check entry points
        run: |
          for file in index.js guoba.support.js apps/*.js scripts/*.mjs; do
            node --check "$file"
          done
      - run: git diff --check "$(git rev-list --max-parents=0 HEAD)"..HEAD
