name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.20.8, 20]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --no-optional
      - run: pnpm test
      - run: node --check model/core.js
      - run: node --check model/legacy/conversation-scope.js
      - run: node --check model/legacy/tool-visibility.js
      - run: git diff --check "$(git rev-list --max-parents=0 HEAD)"..HEAD
