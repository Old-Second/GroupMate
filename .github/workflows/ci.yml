name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.1, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --no-optional
      - run: pnpm test
      - run: node --check apps/chat.js
      - run: node --check scripts/memory-scenario.mjs
      - run: node --check scripts/measure-memory.mjs
      - run: node --check scripts/smoke-openai-compatible.mjs
      - run: git diff --check "$(git rev-list --max-parents=0 HEAD)"..HEAD
